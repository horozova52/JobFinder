<?xml version='1.0' encoding='utf-8'?>
<svg width="100%" viewBox="0 0 340 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Candidați din diverse domenii conectați la angajatori</title>
<desc>Flux compact cu profesioniști, platformă centrală și rezultat pentru angajator</desc>

<defs>
  <style>
    /* === FLOATING PILLS === */
    @keyframes floatUp   { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-5px)} }
    @keyframes floatDown { 0%,100%{transform:translateY(0)}   50%{transform:translateY(5px)}  }

    .pill-1  { animation: floatUp   3.8s ease-in-out infinite 0.0s; transform-box:fill-box; transform-origin:center; }
    .pill-2  { animation: floatDown 4.2s ease-in-out infinite 0.4s; transform-box:fill-box; transform-origin:center; }
    .pill-3  { animation: floatUp   3.5s ease-in-out infinite 0.8s; transform-box:fill-box; transform-origin:center; }
    .pill-4  { animation: floatDown 4.6s ease-in-out infinite 0.2s; transform-box:fill-box; transform-origin:center; }
    .pill-5  { animation: floatUp   4.0s ease-in-out infinite 1.0s; transform-box:fill-box; transform-origin:center; }
    .pill-6  { animation: floatDown 3.7s ease-in-out infinite 0.6s; transform-box:fill-box; transform-origin:center; }

    /* === FLOW LINES === */
    @keyframes dash { to { stroke-dashoffset: -18; } }
    .flow-line { stroke-dasharray: 5 4; animation: dash 1.6s linear infinite; }
    .flow-slow { stroke-dasharray: 5 4; animation: dash 2.2s linear infinite; }

    /* === CENTER HUB PULSE === */
    @keyframes hubPulse {
      0%,100% { opacity: 0.08; r: 68; }
      50%      { opacity: 0.14; r: 74; }
    }
    .hub-glow { animation: hubPulse 2.8s ease-in-out infinite; }

    /* === EMPLOYER CARDS FADE IN === */
    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .card-1 { animation: cardIn 0.6s ease-out 0.2s both; }
    .card-2 { animation: cardIn 0.6s ease-out 0.5s both; }
    .card-3 { animation: cardIn 0.6s ease-out 0.8s both; }

    /* === SCORE BAR FILL === */
    @keyframes barFill1 { from { width: 0; } to { width: 55px; } }
    @keyframes barFill2 { from { width: 0; } to { width: 55px; } }
    @keyframes barFill3 { from { width: 0; } to { width: 55px; } }
    @keyframes barFill4 { from { width: 0; } to { width: 55px; } }
    @keyframes barFill5 { from { width: 0; } to { width: 55px; } }

    /* === STATUS DOT BLINK === */
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    .dot-1 { animation: blink 2.0s ease-in-out infinite 0.0s; }
    .dot-2 { animation: blink 2.0s ease-in-out infinite 0.4s; }
    .dot-3 { animation: blink 2.0s ease-in-out infinite 0.8s; }
    .dot-4 { animation: blink 2.0s ease-in-out infinite 1.2s; }
    .dot-5 { animation: blink 2.0s ease-in-out infinite 0.6s; }

    /* === BOTTOM LABEL FADE === */
    @keyframes labelPulse { 0%,100%{opacity:.7} 50%{opacity:1} }
    .bottom-label { animation: labelPulse 3s ease-in-out infinite; }
  </style>

  <!-- shadow filter for cards -->
  <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.08"/>
  </filter>
</defs>

<!-- ======================== -->
<!--   ROW 1 — PROFESII      -->
<!-- ======================== -->

<g class="pill-1">
  <rect x="10" y="10" width="100" height="38" rx="19" fill="#ede9fe" stroke="#c4b5fd" stroke-width=".8"/>
  <text x="60" y="33" text-anchor="middle" dominant-baseline="central"
        fill="#4f46e5" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Developer</text>
</g>

<g class="pill-2">
  <rect x="120" y="10" width="80" height="38" rx="19" fill="#fce7f3" stroke="#f9a8d4" stroke-width=".8"/>
  <text x="160" y="33" text-anchor="middle" dominant-baseline="central"
        fill="#9d174d" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Medic</text>
</g>

<g class="pill-3">
  <rect x="210" y="10" width="120" height="38" rx="19" fill="#fff7ed" stroke="#fdba74" stroke-width=".8"/>
  <text x="270" y="33" text-anchor="middle" dominant-baseline="central"
        fill="#9a3412" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Inginer</text>
</g>

<!-- ======================== -->
<!--   ROW 2 — PROFESII      -->
<!-- ======================== -->

<g class="pill-4">
  <rect x="20" y="62" width="100" height="38" rx="19" fill="#f0fdf4" stroke="#86efac" stroke-width=".8"/>
  <text x="70" y="85" text-anchor="middle" dominant-baseline="central"
        fill="#166534" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Contabil</text>
</g>

<g class="pill-5">
  <rect x="130" y="62" width="95" height="38" rx="19" fill="#eff6ff" stroke="#93c5fd" stroke-width=".8"/>
  <text x="177" y="85" text-anchor="middle" dominant-baseline="central"
        fill="#1e40af" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Profesor</text>
</g>

<g class="pill-6">
  <rect x="235" y="62" width="95" height="38" rx="19" fill="#fef9c3" stroke="#fde68a" stroke-width=".8"/>
  <text x="282" y="85" text-anchor="middle" dominant-baseline="central"
        fill="#92400e" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Marketing</text>
</g>

<!-- ======================== -->
<!--  FLOW LINES → HUB       -->
<!-- ======================== -->
<line x1="60"  y1="50" x2="150" y2="143" stroke="#6366f1" stroke-width="1"   opacity=".3" class="flow-line"/>
<line x1="160" y1="50" x2="165" y2="143" stroke="#db2777" stroke-width="1"   opacity=".28" class="flow-slow"/>
<line x1="270" y1="50" x2="190" y2="143" stroke="#ea580c" stroke-width="1"   opacity=".28" class="flow-line"/>
<line x1="70"  y1="100" x2="155" y2="143" stroke="#16a34a" stroke-width="1"  opacity=".28" class="flow-slow"/>
<line x1="177" y1="100" x2="170" y2="143" stroke="#2563eb" stroke-width="1"  opacity=".28" class="flow-line"/>
<line x1="282" y1="100" x2="185" y2="143" stroke="#ca8a04" stroke-width="1"  opacity=".28" class="flow-slow"/>

<!-- ======================== -->
<!--   CENTRAL HUB           -->
<!-- ======================== -->
<!-- Glow ring -->
<circle cx="170" cy="160" fill="#6366f1" class="hub-glow"/>

<rect x="110" y="130" width="120" height="54" rx="14" fill="#6366f1" opacity=".07"/>
<rect x="120" y="135" width="100" height="44" rx="10" fill="#6366f1" opacity=".92"
      filter="url(#cardShadow)"/>

<text x="170" y="153" text-anchor="middle" dominant-baseline="central"
      fill="#fff" font-size="13" font-weight="800" font-family="system-ui,sans-serif">JobFinder</text>
<text x="170" y="169" text-anchor="middle" dominant-baseline="central"
      fill="rgba(255,255,255,.75)" font-size="10" font-weight="500" font-family="system-ui,sans-serif">matching automat</text>

<!-- ======================== -->
<!--  FLOW LINES HUB → CARDS -->
<!-- ======================== -->
<line x1="145" y1="182" x2="80"  y2="225" stroke="#6366f1" stroke-width="1.4" opacity=".3" class="flow-slow"/>
<line x1="170" y1="182" x2="170" y2="225" stroke="#6366f1" stroke-width="1.6" opacity=".35" class="flow-line"/>
<line x1="195" y1="182" x2="260" y2="225" stroke="#6366f1" stroke-width="1.4" opacity=".3" class="flow-slow"/>

<!-- ======================== -->
<!--   EMPLOYER CARDS        -->
<!-- ======================== -->

<!-- Card 1: TechCorp -->
<g class="card-1">
  <rect x="20" y="225" width="135" height="70" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width=".7"
        filter="url(#cardShadow)"/>
  <!-- logo box -->
  <rect x="30" y="235" width="30" height="20" rx="6" fill="#111827"/>
  <rect x="36" y="239" width="6"  height="10" rx="1" fill="#6366f1" opacity=".7"/>
  <rect x="44" y="241" width="5"  height="8"  rx="1" fill="#6366f1" opacity=".45"/>
  <!-- name -->
  <text x="68" y="243" fill="#111827" font-size="11" font-weight="700"
        font-family="system-ui,sans-serif" dominant-baseline="central">TechCorp</text>
  <text x="68" y="257" fill="#9ca3af" font-size="9"
        font-family="system-ui,sans-serif" dominant-baseline="central">IT &amp; Software</text>
  <!-- score badges -->
  <rect x="30" y="267" width="55" height="18" rx="7" fill="#d1fae5"/>
  <circle cx="40" cy="276" r="3" fill="#16a34a" class="dot-1"/>
  <text x="70" y="276" text-anchor="middle" dominant-baseline="central"
        fill="#065f46" font-size="10" font-weight="800" font-family="system-ui,sans-serif">87%</text>

  <rect x="90" y="267" width="55" height="18" rx="7" fill="#fef9c3"/>
  <circle cx="100" cy="276" r="3" fill="#ca8a04" class="dot-2"/>
  <text x="130" y="276" text-anchor="middle" dominant-baseline="central"
        fill="#92400e" font-size="10" font-weight="800" font-family="system-ui,sans-serif">62%</text>
</g>

<!-- Card 2: MedClinic (center, lower) -->
<g class="card-2">
  <rect x="100" y="305" width="140" height="70" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width=".7"
        filter="url(#cardShadow)"/>
  <rect x="110" y="315" width="30" height="20" rx="6" fill="#1e293b"/>
  <rect x="116" y="319" width="7"  height="10" rx="1" fill="#6366f1" opacity=".5"/>
  <rect x="125" y="321" width="5"  height="8"  rx="1" fill="#6366f1" opacity=".4"/>
  <text x="148" y="323" fill="#111827" font-size="11" font-weight="700"
        font-family="system-ui,sans-serif" dominant-baseline="central">MedClinic</text>
  <text x="148" y="337" fill="#9ca3af" font-size="9"
        font-family="system-ui,sans-serif" dominant-baseline="central">Sănătate</text>
  <rect x="110" y="348" width="55" height="18" rx="7" fill="#d1fae5"/>
  <circle cx="120" cy="357" r="3" fill="#16a34a" class="dot-3"/>
  <text x="150" y="357" text-anchor="middle" dominant-baseline="central"
        fill="#065f46" font-size="10" font-weight="800" font-family="system-ui,sans-serif">91%</text>

  <rect x="172" y="348" width="55" height="18" rx="7" fill="#ede9fe"/>
  <circle cx="182" cy="357" r="3" fill="#6366f1" class="dot-4"/>
  <text x="212" y="357" text-anchor="middle" dominant-baseline="central"
        fill="#4f46e5" font-size="10" font-weight="800" font-family="system-ui,sans-serif">45%</text>
</g>

<!-- Card 3: BizMD -->
<g class="card-3">
  <rect x="190" y="225" width="135" height="70" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width=".7"
        filter="url(#cardShadow)"/>
  <rect x="200" y="235" width="30" height="20" rx="6" fill="#374151"/>
  <rect x="207" y="239" width="8"  height="10" rx="1.5" fill="#6366f1" opacity=".5"/>
  <rect x="217" y="241" width="5"  height="8"  rx="1"   fill="#6366f1" opacity=".35"/>
  <text x="238" y="243" fill="#111827" font-size="11" font-weight="700"
        font-family="system-ui,sans-serif" dominant-baseline="central">BizMD</text>
  <text x="238" y="257" fill="#9ca3af" font-size="9"
        font-family="system-ui,sans-serif" dominant-baseline="central">Finanțe</text>
  <rect x="200" y="267" width="55" height="18" rx="7" fill="#fef9c3"/>
  <circle cx="210" cy="276" r="3" fill="#ca8a04" class="dot-5"/>
  <text x="240" y="276" text-anchor="middle" dominant-baseline="central"
        fill="#92400e" font-size="10" font-weight="800" font-family="system-ui,sans-serif">73%</text>

  <rect x="260" y="267" width="55" height="18" rx="7" fill="#f3f4f6"/>
  <circle cx="270" cy="276" r="3" fill="#6b7280" class="dot-1"/>
  <text x="300" y="276" text-anchor="middle" dominant-baseline="central"
        fill="#6b7280" font-size="10" font-weight="800" font-family="system-ui,sans-serif">35%</text>
</g>

<!-- ======================== -->
<!--   BOTTOM LABEL          -->
<!-- ======================== -->
<rect x="72" y="373" width="196" height="22" rx="11" fill="#fff" opacity=".92"/>
<text x="170" y="385" text-anchor="middle" dominant-baseline="central"
      fill="#6366f1" font-size="10" font-weight="800" letter-spacing="2.2"
      font-family="system-ui,sans-serif" class="bottom-label">MATCHING TRANSPARENT</text>

</svg>